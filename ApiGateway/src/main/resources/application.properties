spring.application.name=API-GATEWAY

# ===============================
# Server
# ===============================

server.port=${PORT:8080}


# ===============================
# Eureka
# ===============================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ===============================
# Employee Service
# ===============================

spring.cloud.gateway.server.webflux.routes[0].id=employee-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/employee-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1


# ===============================
# Department Service
# ===============================

spring.cloud.gateway.server.webflux.routes[1].id=department-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/department-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1


# ===============================
# Project Service
# ===============================

spring.cloud.gateway.server.webflux.routes[2].id=project-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PROJECT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/project-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# ===============================
# CORS Configuration
# ===============================

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=https://microservices-frontend-git-main-shop-smart.vercel.app

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true